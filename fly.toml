app = "reenact-kane"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  REENACT_PUBLIC_URL = "https://reenact-kane.fly.dev"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
