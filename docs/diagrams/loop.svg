<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">The Reenact loop</title>
  <desc id="d">A bug report is compiled into a Kane test, run in a real browser and judged. If reproduced, an agent edits the code and the same test must pass. The test is kept as a regression test.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#141414"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D7301F"/></marker>
    <style>
      text { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; fill: #141414; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .k { font-size: 11px; letter-spacing: 1.4px; fill: #5b5851; }
      .t { font-size: 21px; }
      .s { font-size: 11px; fill: #5b5851; }
      .box { fill: none; stroke: #141414; stroke-width: 1.5; }
      .ln { fill: none; stroke: #141414; stroke-width: 1.5; }
      .red { stroke: #D7301F; fill: none; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#F4F1EA"/>
  <text x="40" y="52" class="k">THE LOOP</text>
  <text x="40" y="92" class="serif" style="font-size:40px">A report goes in. Proof comes out.</text>

  <!-- row 1 -->
  <g>
    <rect class="box" x="40" y="150" width="190" height="110"/>
    <text x="56" y="178" class="k">01 · INPUT</text>
    <text x="56" y="212" class="serif t">Bug report</text>
    <text x="56" y="238" class="s">issue, as written</text>

    <rect class="box" x="290" y="150" width="190" height="110"/>
    <text x="306" y="178" class="k">02 · COMPILE</text>
    <text x="306" y="212" class="serif t">Plan</text>
    <text x="306" y="238" class="s">LLM → fixed JSON</text>

    <rect class="box" x="540" y="150" width="190" height="110"/>
    <text x="556" y="178" class="k">03 · RENDER</text>
    <text x="556" y="212" class="serif t">Kane test</text>
    <text x="556" y="238" class="s">Rust writes the file</text>

    <rect class="box" x="790" y="150" width="190" height="110" style="stroke:#D7301F;stroke-width:2"/>
    <text x="806" y="178" class="k">04 · REENACT</text>
    <text x="806" y="212" class="serif t">Real browser</text>
    <text x="806" y="238" class="s">Kane drives Chrome</text>

    <rect class="box" x="1040" y="150" width="130" height="110"/>
    <text x="1054" y="178" class="k">05 · JUDGE</text>
    <text x="1054" y="212" class="serif t">Verdict</text>
    <text x="1054" y="238" class="s">4 outcomes</text>
  </g>
  <g marker-end="url(#a)">
    <path class="ln" d="M230 205H288"/><path class="ln" d="M480 205H538"/><path class="ln" d="M730 205H788"/><path class="ln" d="M980 205H1038"/>
  </g>

  <!-- verdict outcomes -->
  <g class="s">
    <text x="1040" y="292">Reproduced</text>
    <text x="1040" y="312">Not reproduced</text>
    <text x="1040" y="332">Needs info</text>
    <text x="1040" y="352">Inconclusive</text>
  </g>
  <path d="M1105 262V276" class="ln"/>
  <circle cx="1028" cy="287" r="4" fill="#D7301F"/>

  <!-- row 2: fix -->
  <path class="red" d="M1040 287H1010V400H980" marker-end="url(#r)"/>
  <g>
    <rect class="box" x="790" y="350" width="190" height="110"/>
    <text x="806" y="378" class="k">06 · FIX</text>
    <text x="806" y="412" class="serif t">Agent edits</text>
    <text x="806" y="438" class="s">exact search/replace</text>

    <rect class="box" x="540" y="350" width="190" height="110" style="stroke:#D7301F;stroke-width:2"/>
    <text x="556" y="378" class="k">07 · VERIFY</text>
    <text x="556" y="412" class="serif t">Same test</text>
    <text x="556" y="438" class="s">live run, no cache</text>

    <rect class="box" x="290" y="350" width="190" height="110"/>
    <text x="306" y="378" class="k">08 · SHIP</text>
    <text x="306" y="412" class="serif t">PR + proof</text>
    <text x="306" y="438" class="s">before/after + log</text>

    <rect class="box" x="40" y="350" width="190" height="110"/>
    <text x="56" y="378" class="k">09 · KEEP</text>
    <text x="56" y="412" class="serif t">Regression</text>
    <text x="56" y="438" class="s">re-run by `suite`</text>
  </g>
  <g marker-end="url(#a)">
    <path class="ln" d="M790 405H732"/><path class="ln" d="M540 405H482"/><path class="ln" d="M290 405H232"/>
  </g>
  <!-- retry loop -->
  <path class="red" d="M635 350V310H885V350" stroke-dasharray="5 5" marker-end="url(#r)" style="display:none"/>
  <path class="red" d="M600 468V510H885V462" stroke-dasharray="5 5" marker-end="url(#r)"/>
  <text x="640" y="532" class="s" style="fill:#D7301F">still reproduced? feed Kane's result back, up to 3 attempts</text>
</svg>
